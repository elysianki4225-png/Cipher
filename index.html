<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>加密备忘录 V1.0 Final Final 真不修改版</title>
    <style>
        /* 真人的毛病：直接用系统宋体，加上极其反人类的色彩 */
        body {
            background-color: #008080; /* Win98 经典桌面绿 */
            font-family: "宋体", "MS Sans Serif", sans-serif;
            color: #000;
            margin: 0;
            padding: 10px;
            overflow-y: scroll;
        }
        /* AI 的毛病：到处都是莫名其妙的边框和发光 */
        .container {
            background-color: #C0C0C0;
            border: 4px inset #fff;
            width: 800px;
            margin: 0 auto;
            padding: 10px;
        }
        .header {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 5px;
            font-weight: bold;
            text-align: center;
            border: 2px outset #fff;
            font-size: 18px;
            animation: blink 1s infinite; /* 极致的生硬闪烁 */
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        .ai-panel {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            border: 3px double #ff0000;
            margin: 10px 0;
            padding: 10px;
            font-size: 12px;
        }
        
        /* 真人的毛病：滥用 !important 和魔法数字 */
        .btn {
            background-color: #C0C0C0 !important;
            border: 2px outset #fff !important;
            padding: 4px 15px !important;
            cursor: pointer;
            font-family: "宋体" !important;
            font-size: 14px !important;
            margin-right: 777px; /* 魔法数字 */
        }
        .btn:active {
            border: 2px inset #fff !important;
        }
        
        .memo-item {
            border: 1px solid #808080;
            background-color: #fff;
            margin: 5px 0;
            padding: 10px;
            cursor: pointer;
            /* 毫无平滑过渡，极其生硬 */
        }
        
        .input-area {
            border: 2px inset #fff;
            padding: 10px;
            background-color: #E0E0E0;
            margin-top: 10px;
        }
        
        textarea {
            width: 100%;
            height: 100px;
            border: 2px inset #808080;
            font-family: "宋体";
        }
        
        .status-bar {
            border: 2px inset #fff;
            margin-top: 10px;
            padding: 2px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        
        .spinner {
            color: red;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">💾 绝密量子加密备忘录 (终极版) 💾</div>
    
    <!-- AI 的极度过度设计：假装自己在做复杂的监控 -->
    <div class="ai-panel">
        <div>[SYS] 正在初始化三维矩阵加密节点...</div>
        <div>[AI] 监测到边缘算力波动，已自动开启抗量子防护。</div>
        <div>[WARN] 哈希碰撞率：<span id="fake-hash">0.0001</span>% (完全没有卵用)</div>
        <div id="ai-chat">AI 助手：您好，主人，我正在监视您的一切...</div>
    </div>

    <div>
        <button class="btn" onclick="doSomethingReal()">刷新缓存</button>
        <button class="btn" onclick="doSomethingFake()">同步区块链</button>
        <span class="spinner" id="loading">拼命加载中，请勿关闭页面...</span>
    </div>

    <div id="memoList" style="height: 400px; overflow-y: scroll; border: 2px inset #fff; background: #fff;">
        <!-- 屎山渲染区 -->
    </div>

    <div class="input-area">
        <h3 style="margin: 0 0 10px 0;">添加新备忘</h3>
        <textarea id="memoContent" placeholder="请输入内容，不支持 Markdown，因为菜"></textarea>
        <br><br>
        <!-- 真人的毛病：不绑定事件，用 onclick 属性 -->
        <button class="btn" onclick="addMemo()" style="width: 100px;">保存 (可能会卡)</button>
    </div>

    <div class="status-bar">
        <span>状态: <span style="color:red;">未连接 (其实连上了)</span></span>
        <span>当前版本: v0.0.1-史前版</span>
    </div>
</div>

<script>
    // 真人的毛病：全局变量满天飞，命名毫无意义
    var a = [];
    var b = 0;
    var c = "测试用Token_不要动";
    var d = true;

    // AI 的毛病：写一堆看起来很高深实际上一点用没有的装饰器/工具函数
    const QuantumHash = (str) => {
        // 假装在做极其复杂的加密
        let hash = 0;
        for (let i = 0; i < str.length * 100; i++) {
            hash = (hash << 5) - hash + str.charCodeAt(i % str.length);
            hash |= 0;
        }
        return hash;
    };

    // 模拟卡顿函数
    function ArtificialLag(ms) {
        let start = Date.now();
        while (Date.now() - start < ms) {
            // 纯纯的卡顿
        }
    }

    // 初始化
    window.onload = function() {
        document.getElementById("loading").style.display = "inline";
        // 极度生硬的假延迟
        setTimeout(() => {
            loadFakeData();
            document.getElementById("loading").style.display = "none";
            alert("系统初始化完成！");
        }, 2500);
        
        // 随机跳动假数据
        setInterval(() => {
            document.getElementById("fake-hash").innerText = (Math.random() * 0.1).toFixed(6);
        }, 500);
    };

    // AI 的毛病：疯狂渲染 DOM，不加虚拟列表，一多就卡死
    function loadFakeData() {
        const list = document.getElementById("memoList");
        list.innerHTML = "";
        
        for (let i = 0; i < 50; i++) {
            var item = document.createElement("div");
            item.className = "memo-item";
            // 真人的毛病：直接塞 HTML 字符串
            item.innerHTML = `
                <div style="font-weight:bold; color:blue;">备忘标题 ${i} [量子加密已完成]</div>
                <div style="font-size:12px; color:#666;">测试数据：这是一段没有任何意义的占位文本，哈希值 ${QuantumHash("abc" + i)}</div>
                <div style="font-size:12px; margin-top:5px;">时间: 2026-11-05</div>
            `;
            item.onclick = function() {
                // 交互极其反人类：点击直接弹窗
                alert("您点击了备忘，但该功能暂未实现，请联系管理员。");
            };
            list.appendChild(item);
        }
    }

    // 屎山逻辑：保存备忘录
    function addMemo() {
        var content = document.getElementById("memoContent").value;
        if (content == "") {
            // 极不友好的提示
            alert("你特么倒是写点东西啊！");
            return;
        }

        document.getElementById("loading").style.display = "inline";
        
        // 疯狂消耗 CPU 假装在加密
        ArtificialLag(1500); 

        // 假装的异步
        setTimeout(function() {
            var list = document.getElementById("memoList");
            var item = document.createElement("div");
            item.className = "memo-item";
            item.style.backgroundColor = "#FFD700"; // 屎黄色
            item.innerHTML = `
                <div style="font-weight:bold; color:red;">新备忘 (未保存至云端)</div>
                <div style="font-size:12px;">${content}</div>
                <div style="font-size:12px; color:gray;">刚刚</div>
            `;
            list.insertBefore(item, list.firstChild);
            
            document.getElementById("memoContent").value = "";
            document.getElementById("loading").style.display = "none";
            
            // 极其生硬的反馈
            document.getElementById("ai-chat").innerText = "AI 助手：我已吃了你的数据，嗝~";
            
            // 故意不用 alert，用恶心的 console.log
            console.log("Data processed poorly");
        }, 1000);
    }

    function doSomethingReal() {
        alert("缓存已清理，但没完全清理。");
    }

    function doSomethingFake() {
        document.getElementById("ai-chat").innerText = "AI 助手：正在同步第 " + Math.floor(Math.random() * 999999) + " 个区块...";
    }
</script>

</body>
</html>
